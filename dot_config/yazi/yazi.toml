[mgr]
show_hidden = true

[opener]
code = [
	{ run = "code %s", orphan = true, desc = "VS Code" },
]
nvim = [
	{ run = "nvim %s", block = true, desc = "Neovim" },
]
browser = [
	{ run = "firefox %s", orphan = true, desc = "Firefox" },
]
gimp = [
	{ run = "gimp %s", orphan = true, desc = "GIMP" },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
open = [
	{ run = "xdg-open %s1", orphan = true, desc = "System default" },
]

# First matching rule wins. Press `O` in yazi to pick another opener from the list.
[open]
rules = [
	# Directories
	{ url = "*/", use = ["code", "open"] },

	# Text and code
	{ mime = "text/*", use = ["code", "nvim"] },
	{ mime = "application/{json,ndjson,xml,javascript,x-shellscript,toml,yaml}", use = ["code", "nvim"] },
	{ mime = "inode/empty", use = ["code", "nvim"] },

	# Images
	{ mime = "image/*", use = ["browser", "gimp", "open"] },

	# Video and audio (Firefox handles mp4/webm/mp3/ogg etc.)
	{ mime = "{audio,video}/*", use = ["browser", "open"] },

	# Documents
	{ mime = "application/pdf", use = ["browser", "open"] },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "open"] },

	# Everything else
	{ url = "*", use = ["code", "nvim", "open"] },
]
